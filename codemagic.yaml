workflows:
  android-workflow:
    name: Android Build Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Add and Sync Capacitor Android
        script: |
          npm install @capacitor/android
          npx cap add android || true
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-workflow:
    name: iOS Build Workflow (Unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Add and Sync Capacitor iOS
        script: |
          npm install @capacitor/ios
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods Safely
        script: |
          if [ -d "ios/App" ] && [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
          elif [ -d "ios" ] && [ -f "ios/Podfile" ]; then
            cd ios
            pod install
          else
            echo "No Podfile found, skipping pod install."
          fi
      - name: Build Unsigned iOS App (Simulator/Debug)
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios/iphonesimulator/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app